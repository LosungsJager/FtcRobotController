name: Android TeamCode Build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ refactor/defined-architecture ]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile FTC TeamCode
        run: ./gradlew :TeamCode:compileDebugJavaWithJavac --no-daemon --stacktrace
